[package]
name = "fortibackup"
version = "0.5.1"
edition = "2021"
rust-version = "1.80"
description = "Automated configuration backup tool for FortiGate devices"
license = "MIT"
authors = ["Luis Herrera <luis.herrera1974@gmail.com>"]
readme = "README.md"
repository = "https://github.com/lherrera/fortibackup"
keywords = ["fortigate", "backup", "network", "cli", "daemon"]
categories = ["command-line-utilities", "network-programming"]

[dependencies]
# Async runtime
tokio = { version = "1.40", features = ["full"] }
async-trait = "0.1.83"
futures = "0.3.31"

# HTTP client (rustls, no openssl)
reqwest = { version = "0.12.8", default-features = false, features = ["json", "rustls-tls", "rustls-tls-native-roots", "stream"] }

# SSH client
russh = "0.46.0"
russh-keys = "0.46.0"

# CLI
clap = { version = "4.5.20", features = ["derive", "env"] }
clap_complete = "4.5.36"
clap_mangen = "0.2.24"

# Config
serde = { version = "1.0.213", features = ["derive"] }
serde_json = "1.0.132"
toml = "0.8.19"

# Scheduling
tokio-cron-scheduler = "0.13.0"
uuid = "1.10"

# Logging
tracing = "0.1.40"
tracing-subscriber = { version = "0.3.18", features = ["env-filter", "json", "fmt", "time"] }

# Email
lettre = { version = "0.11.10", default-features = false, features = ["smtp-transport", "rustls-tls", "tokio1-rustls-tls", "builder", "tokio1"] }

# Hashing
sha2 = "0.10.8"
hex = "0.4.3"

# Dates
chrono = { version = "0.4.38", features = ["serde"] }

# Errors
anyhow = "1.0.91"
thiserror = "1.0.65"

# Filesystem / utilities
walkdir = "2.5.0"
humantime = "2.1.0"

# Compression (optional opt-in for stored backups)
flate2 = "1.0.34"

# Prometheus metrics + minimal HTTP server for the /metrics endpoint
prometheus = { version = "0.13.4", default-features = false }
hyper = { version = "1.5.0", features = ["server", "http1"] }
hyper-util = { version = "0.1.10", features = ["tokio"] }
http-body-util = "0.1.2"
bytes = "1.7.2"

# S3 / S3-compatible (MinIO) mirror destination
aws-config = { version = "1.5.10", default-features = false, features = ["rustls", "behavior-version-latest", "rt-tokio"] }
aws-sdk-s3 = { version = "1.59.0", default-features = false, features = ["rustls", "behavior-version-latest", "rt-tokio"] }
aws-credential-types = "1.2.1"

# Web UI dependencies
base64 = "0.22.1"
subtle = "2.6.1"
similar = "2.6.0"

[dev-dependencies]
wiremock = "0.6.2"
tempfile = "3.13.0"
tokio = { version = "1.40", features = ["full", "test-util"] }
pretty_assertions = "1.4.1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true

# -----------------------------------------------------------------------------
# Debian packaging via `cargo deb`.
# Build with:  cargo deb
# Install:     sudo apt install ./target/debian/fortibackup_*_amd64.deb
# -----------------------------------------------------------------------------
[package.metadata.deb]
maintainer = "Luis Herrera <luis.herrera@rnpn.gob.sv>"
copyright = "2026, Luis Herrera <luis.herrera@rnpn.gob.sv>"
license-file = ["LICENSE", "4"]
extended-description = """\
fortibackup connects periodically to one or more FortiGate devices, downloads \
their running configuration via the REST API or SSH, versions the result on \
disk with metadata, and notifies on failures via email or webhook. Designed to \
run as an unattended systemd service."""
depends = "$auto, adduser"
section = "net"
priority = "optional"
assets = [
    ["target/release/fortibackup", "usr/bin/", "755"],
    ["config.example.toml", "etc/fortibackup/config.example.toml", "644"],
    ["README.md", "usr/share/doc/fortibackup/README.md", "644"],
    ["LICENSE", "usr/share/doc/fortibackup/LICENSE", "644"],
    ["target/man/fortibackup.1.gz", "usr/share/man/man1/fortibackup.1.gz", "644"],
    ["target/completions/fortibackup.bash", "usr/share/bash-completion/completions/fortibackup", "644"],
    ["target/completions/_fortibackup", "usr/share/zsh/vendor-completions/_fortibackup", "644"],
    ["target/completions/fortibackup.fish", "usr/share/fish/vendor_completions.d/fortibackup.fish", "644"],
]
maintainer-scripts = "debian/"
changelog = "debian/changelog"
systemd-units = { unit-name = "fortibackup", unit-scripts = "systemd", enable = false, start = false }
conf-files = ["/etc/fortibackup/config.example.toml"]

[lib]
name = "fortibackup"
path = "src/lib.rs"

[[bin]]
name = "fortibackup"
path = "src/main.rs"
