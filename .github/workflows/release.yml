name: Release

on:
  push:
    tags:
      - "v*.*.*"

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: write   # create the GitHub Release
  packages: write   # push the docker image to ghcr.io

jobs:
  build-binary:
    name: linux-x86_64 binary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-bin
      - run: cargo build --release --locked
      - name: Strip + name
        run: |
          strip target/release/fortibackup
          mkdir -p dist
          cp target/release/fortibackup dist/fortibackup-${GITHUB_REF_NAME}-x86_64-linux
      - uses: actions/upload-artifact@v4
        with:
          name: binary
          path: dist/*

  build-deb:
    name: .deb package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-deb
      - run: cargo install cargo-deb --locked
      - name: Build deb (with manpage + completions)
        run: make deb
      - uses: actions/upload-artifact@v4
        with:
          name: deb
          path: target/debian/*.deb

  build-docker:
    name: docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ github.ref_name }}
            ghcr.io/${{ github.repository }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          labels: |
            org.opencontainers.image.version=${{ github.ref_name }}
            org.opencontainers.image.revision=${{ github.sha }}

  github-release:
    name: GitHub Release
    runs-on: ubuntu-latest
    needs: [build-binary, build-deb, build-docker]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: binary
          path: dist/
      - uses: actions/download-artifact@v4
        with:
          name: deb
          path: dist/
      - name: Generate checksums
        run: |
          cd dist
          sha256sum * > SHA256SUMS
      - name: Extract release notes from changelog
        id: notes
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          awk -v ver="$VERSION" '
            $0 ~ "fortibackup \\(" ver "-" {flag=1; next}
            flag && /^fortibackup \(/ {exit}
            flag {print}
          ' debian/changelog > release-notes.md
          echo "" >> release-notes.md
          echo "## Container image" >> release-notes.md
          echo "" >> release-notes.md
          echo '```sh' >> release-notes.md
          echo "docker pull ghcr.io/${{ github.repository }}:${{ github.ref_name }}" >> release-notes.md
          echo '```' >> release-notes.md
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          body_path: release-notes.md
          files: |
            dist/fortibackup-*-x86_64-linux
            dist/fortibackup_*.deb
            dist/SHA256SUMS
          draft: false
          prerelease: false
