name: Release

on:
  push:
    tags:
      - "v*.*.*"
  # Manual trigger from the Actions UI. Useful for the first release
  # after a fresh push (when GitHub sometimes skips tag-triggered runs)
  # or to re-build a previous tag.
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build (e.g. v0.4.1)"
        required: true
        type: string

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: write   # create the GitHub Release
  packages: write   # push the docker image to ghcr.io

jobs:
  resolve:
    name: resolve tag
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.t.outputs.tag }}
    steps:
      - id: t
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

  build-binary:
    name: linux-x86_64 binary
    needs: resolve
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.tag }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-bin
      - run: cargo build --release --locked
      - name: Strip + name
        run: |
          strip target/release/fortibackup
          mkdir -p dist
          cp target/release/fortibackup dist/fortibackup-${{ needs.resolve.outputs.tag }}-x86_64-linux
      - uses: actions/upload-artifact@v4
        with:
          name: binary
          path: dist/*

  build-deb:
    name: .deb package
    needs: resolve
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.tag }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-deb
      - run: cargo install cargo-deb --locked
      - name: Build deb (with manpage + completions)
        run: make deb
      - uses: actions/upload-artifact@v4
        with:
          name: deb
          path: target/debian/*.deb

  build-docker:
    name: docker image
    needs: resolve
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.tag }}
      - uses: docker/setup-buildx-action@v4
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ needs.resolve.outputs.tag }}
            ghcr.io/${{ github.repository }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          labels: |
            org.opencontainers.image.version=${{ needs.resolve.outputs.tag }}
            org.opencontainers.image.revision=${{ github.sha }}

  github-release:
    name: GitHub Release
    runs-on: ubuntu-latest
    needs: [resolve, build-binary, build-deb, build-docker]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.tag }}
      - uses: actions/download-artifact@v4
        with:
          name: binary
          path: dist/
      - uses: actions/download-artifact@v4
        with:
          name: deb
          path: dist/
      - name: Generate checksums
        run: |
          cd dist
          sha256sum * > SHA256SUMS
      - name: Extract release notes from changelog
        run: |
          TAG="${{ needs.resolve.outputs.tag }}"
          VERSION="${TAG#v}"
          awk -v ver="$VERSION" '
            $0 ~ "fortibackup \\(" ver "-" {flag=1; next}
            flag && /^fortibackup \(/ {exit}
            flag {print}
          ' debian/changelog > release-notes.md
          echo "" >> release-notes.md
          echo "## Container image" >> release-notes.md
          echo "" >> release-notes.md
          echo '```sh' >> release-notes.md
          echo "docker pull ghcr.io/${{ github.repository }}:${TAG}" >> release-notes.md
          echo '```' >> release-notes.md
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.resolve.outputs.tag }}
          name: ${{ needs.resolve.outputs.tag }}
          body_path: release-notes.md
          files: |
            dist/fortibackup-*-x86_64-linux
            dist/fortibackup_*.deb
            dist/SHA256SUMS
          draft: false
          prerelease: false
