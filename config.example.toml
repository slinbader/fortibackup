# fortibackup — example configuration
# Copy to /etc/fortibackup/config.toml and adjust for your environment.
# Secrets are NEVER stored in this file; *_env fields point to environment
# variables that are read at runtime (see /etc/fortibackup/environment for
# the systemd EnvironmentFile).

[global]
backup_dir = "/var/lib/fortibackup"
retention_days = 90
retention_min_copies = 7
log_level = "info"
# When true, stored configs are gzip-compressed (.conf.gz). FortiGate
# configs are mostly text and shrink ~10x. The sidecar JSON always stores
# the plaintext SHA-256 so no_change detection works regardless.
compress = false

# Optional Prometheus metrics exporter. Comment out or omit to disable.
# Exposes /metrics on the bound address — scrape from your Prometheus.
[metrics]
listen = "127.0.0.1:9090"

# Optional embedded Web UI for browsing devices and triggering backups.
# Active only under the `run` daemon. HTTP Basic auth — set the password
# in the environment file referenced by the systemd unit.
# [webui]
# listen = "127.0.0.1:8080"
# user = "admin"
# password_env = "FORTIBACKUP_WEBUI_PASS"

# Institutional header for the web UI's monthly backup report (/report), which
# is meant to be printed to PDF or exported to CSV as evidence for management.
# Both fields are optional and default to "RNPN" / "Unidad de Redes y
# Ciberseguridad".
# [report]
# org_name = "RNPN"
# subtitle = "Unidad de Redes y Ciberseguridad"

# Optional S3 / S3-compatible (MinIO, Wasabi, B2) mirror. Filesystem is
# always the primary, authoritative store; this just uploads a copy of each
# new backup. Leave out the block entirely to disable.
# [storage.s3]
# bucket = "fortibackup-prod"
# region = "us-east-1"
# endpoint = "https://minio.internal:9000"   # omit for AWS
# prefix = "fortigates"
# access_key_env = "S3_ACCESS_KEY"
# secret_key_env = "S3_SECRET_KEY"
# force_path_style = true                     # required for MinIO

# Optional backup-overdue watchdog. Alerts (over the notifications.on_failure
# channels) when a device hasn't had a *successful* backup within stale_after.
# This catches the silent case a failed-fetch alert can't: the scheduler died,
# the host was down, or the device was unreachable for longer than expected —
# no fetch was attempted, so nothing "failed". It checks every check_interval,
# re-alerts at most once every 24h while stale, and sends a recovery notice
# when backups resume. Requires at least one on_failure channel below.
# [watchdog]
# enabled = true
# stale_after = "26h"      # daily schedule + a couple hours of grace
# check_interval = "1h"

[notifications]
on_failure = ["email", "webhook"]
on_success = []  # leave empty to stay quiet on successful backups

[notifications.email]
smtp_host = "smtp.gmail.com"
smtp_port = 587
smtp_user = "alerts@example.com"
smtp_password_env = "SMTP_PASSWORD"
from = "alerts@example.com"
to = ["luis.herrera@rnpn.gob.sv"]

[notifications.webhook]
url = "https://hooks.slack.com/services/xxx"
method = "POST"

# ---------------------------------------------------------------------------
# Devices
# ---------------------------------------------------------------------------

[[devices]]
name = "fortigate-primary"
host = "10.0.0.1"
port = 443
method = "api"
api_token_env = "FGT_TOKEN_PRIMARY"
# cron format: sec min hour day month weekday
schedule = "0 0 2 * * *"   # 02:00 every day
verify_tls = false
timeout_secs = 60

[[devices]]
name = "fortigate-secondary"
host = "10.0.0.2"
port = 22
method = "ssh"
ssh_username = "backup_user"
ssh_key_path = "/etc/fortibackup/keys/id_ed25519"
# alternatively:
# ssh_password_env = "FGT_SSH_PASSWORD_SECONDARY"
schedule = "0 0 3 * * *"   # 03:00 every day
timeout_secs = 120
